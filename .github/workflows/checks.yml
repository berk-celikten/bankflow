name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: bash backend/mvnw -B -f backend/pom.xml clean verify

  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start isolated Oracle test database
        shell: bash
        run: |
          oracle_password="Bf_$(openssl rand -hex 20)"
          test_password="Bf_$(openssl rand -hex 20)"
          echo "::add-mask::$oracle_password"
          echo "::add-mask::$test_password"
          export ORACLE_PASSWORD="$oracle_password"
          export APP_USER=bankflow_test
          export APP_USER_PASSWORD="$test_password"
          echo "BANKFLOW_DB_URL=jdbc:oracle:thin:@//localhost:1521/FREEPDB1" >> "$GITHUB_ENV"
          echo "BANKFLOW_DB_USER=bankflow_test" >> "$GITHUB_ENV"
          echo "BANKFLOW_DB_PASSWORD=$test_password" >> "$GITHUB_ENV"
          docker run -d --name bankflow-oracle \
            -p 127.0.0.1:1521:1521 \
            -e ORACLE_PASSWORD -e APP_USER -e APP_USER_PASSWORD \
            --health-cmd healthcheck.sh --health-interval 10s \
            --health-start-period 120s --health-retries 30 \
            gvenzl/oracle-free:23.26.3-slim-faststart
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' bankflow-oracle)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then echo 'Oracle did not become healthy'; exit 1; fi
            sleep 10
          done
          echo 'Oracle startup timed out'
          exit 1
      - name: Verify Oracle migration and transfer contracts
        run: bash backend/mvnw -B -f backend/pom.xml -Dtest=OracleIntegrationTest test
      - name: Remove test database
        if: always()
        run: docker rm -f bankflow-oracle || true

  demo:
    needs: [frontend, backend, oracle]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure ephemeral demo
        shell: bash
        run: |
          oracle_password="Bf_$(openssl rand -hex 20)"
          app_password="Bf_$(openssl rand -hex 20)"
          demo_password="Bf_$(openssl rand -hex 20)"
          echo "::add-mask::$oracle_password"
          echo "::add-mask::$app_password"
          echo "::add-mask::$demo_password"
          printf 'BANKFLOW_ORACLE_PASSWORD=%s\nBANKFLOW_DB_PASSWORD=%s\nBANKFLOW_DEMO_PASSWORD=%s\n' \
            "$oracle_password" "$app_password" "$demo_password" > "$RUNNER_TEMP/bankflow.env"
          echo "BANKFLOW_DEMO_PASSWORD=$demo_password" >> "$GITHUB_ENV"
      - name: Build and start application with Oracle
        run: docker compose --env-file "$RUNNER_TEMP/bankflow.env" -f infra/compose.yaml up --build -d --wait --wait-timeout 600
      - name: Wait for UI and API
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/ | grep -q 'id="root"' && \
              curl --fail --silent http://127.0.0.1:8080/api/auth/csrf | grep -q '"token"'; then exit 0; fi
            sleep 2
          done
          echo 'UI/API did not become ready'
          exit 1
      - name: Verify live session and money operations
        run: node tests/api-smoke.mjs
      - name: Stop ephemeral demo
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/bankflow.env" -f infra/compose.yaml down --volumes
