spring:
  application:
    name: bankflow
  datasource:
    url: ${BANKFLOW_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${BANKFLOW_DB_USER:bankflow}
    password: ${BANKFLOW_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${BANKFLOW_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
